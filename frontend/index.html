// =================================================================
// Date + formatting helpers
// =================================================================
function daysUntil(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const now = new Date();
  now.setHours(0, 0, 0, 0);
  return Math.round((d - now) / 86400000);
}
function fmtDate(dateStr) {
  return new Date(dateStr + 'T00:00:00').toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
}
function addDaysToDate(dateStr, days) {
  const expired = daysUntil(dateStr) < 0;
  const base = expired ? new Date() : new Date(dateStr + 'T00:00:00');
  base.setDate(base.getDate() + days);
  return base.toISOString().slice(0, 10);
}
// The backend (Postgres, via config.php) always stores and sends
// timestamps as naive UTC strings like "2026-07-24 21:10:00" — no "Z",
// no offset. Left alone, `new Date(...)` on a string like that is parsed
// as LOCAL time by the browser, not UTC, so anyone not physically in the
// UTC zone would see the wrong clock reading. toUtcDate() forces correct
// UTC parsing, and both formatters below explicitly pin the OUTPUT to
// Asia/Kolkata — so "last seen" / activity times always read as true
// Indian Standard Time, regardless of the admin's own device timezone.
function toUtcDate(value) {
  if (!value) return null;
  if (value instanceof Date) return value;
  let s = String(value).trim().replace(' ', 'T');
  if (!/Z$|[+-]\d{2}:?\d{2}$/.test(s)) s += 'Z'; // mark as UTC if no zone info present
  const d = new Date(s);
  return isNaN(d) ? null : d;
}
function fmtDT(value) {
  const d = toUtcDate(value);
  if (!d) return '—';
  return d.toLocaleString('en-IN', {
    timeZone: 'Asia/Kolkata',
    day: '2-digit', month: 'short', year: 'numeric',
    hour: '2-digit', minute: '2-digit', hour12: true,
  }) + ' IST';
}
function fmtLogTime(value) {
  const d = toUtcDate(value);
  if (!d) return '—';
  return d.toLocaleString('en-IN', {
    timeZone: 'Asia/Kolkata',
    day: '2-digit', month: 'short',
    hour: '2-digit', minute: '2-digit', hour12: true,
  }) + ' IST';
}

const navItems = [

  { id: 'users', label: 'Users & Tokens', icon: UsersIcon },
  { id: 'devices', label: 'Devices', icon: Smartphone },
  { id: 'update', label: 'Remote Update', icon: RefreshCw },
  { id: 'logs', label: 'Activity Log', icon: ScrollText },
];

function LogIcon({ action }) {
  const map = { block: Ban, unblock: CheckCircle2, extend: Link2, 'generate-link': Link2, revoke: Smartphone, 'push-update': Send, system: ScrollText };
  const IconComp = map[action] || ScrollText;
  return <IconComp />;
}

function StatusBadge({ user }) {
  if (user.status === 'blocked') return <span className="badge blocked"><Ban />Blocked</span>;
  if (daysUntil(user.expiry) < 0) return <span className="badge expired"><Clock />Expired</span>;
  return <span className="badge active"><CheckCircle2 />Active</span>;
}

function DeviceDots({ count }) {
  const shown = Math.min(count, 6);
  const dots = [];
  for (let i = 0; i < shown; i++) dots.push(<span key={i} className={`dot${i >= MAX_DEVICES ? ' over' : ''}`} />);
  return (
    <span className="dot-cluster">
      {dots}
      <span className={`device-count-text${count > MAX_DEVICES ? ' flag' : ''}`}>{count}/{MAX_DEVICES}{count > MAX_DEVICES ? ' ⚠' : ''}</span>
    </span>
  );
}

.config-error-screen .box { max-width:460px; background:var(--surface); border:1px solid var(--danger); border-radius:12px; padding:24px; }
.config-error-screen h3 { font-family:'Space Grotesk'; color:var(--danger); margin:0 0 8px; font-size:16px; }
.config-error-screen code { font-family:'IBM Plex Mono'; background:var(--bg-elevated); padding:1px 6px; border-radius:4px; font-size:12px; }

@media (max-width: 900px) {
  .sidebar { width:64px; }
  .sidebar .brand-name, .sidebar .brand-sub, .nav-item span, .sidebar-footer, .sidebar-user .who { display:none; }
  .nav-item { justify-content:center; }
  .stat-grid { grid-template-columns:repeat(2,1fr); }
  .two-col { grid-template-columns:1fr; }
}
`;

// =================================================================
// Login screen
// =================================================================
function LoginScreen({ onLogin }) {
  const [username, setUsername] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);

  async function submit(e) {
    e.preventDefault();
    setError('');
    setBusy(true);
    try {
      await onLogin(username, password);
    } catch (err) {
      setError(err.message || 'Login failed');
    } finally {
      setBusy(false);
    }
  }

  return (
    <div className="login-screen">
      <form className="login-box" onSubmit={submit}>
        <div className="brand">
          <div className="brand-mark">AP</div>
          <div>
            <div className="brand-name">AppGuard</div>
            <div className="brand-sub">Admin Console</div>
          </div>
        </div>
        <div className="field">
          <label>Username</label>
          <input type="text" value={username} onChange={e => setUsername(e.target.value)} autoFocus />
        </div>
        <div className="field">
          <label>Password</label>
          <input type="password" value={password} onChange={e => setPassword(e.target.value)} />
        </div>
        {error && <div className="error-text"><AlertTriangle />{error}</div>}
        <button className="btn primary" type="submit" disabled={busy} style={{ justifyContent: 'center' }}>
          {busy ? 'Signing in…' : 'Sign in'}
        </button>
        <div style={{ fontSize: 11.5, color: 'var(--text-muted)' }}>
          No account yet? Run <code style={{ fontFamily: "'IBM Plex Mono'" }}>backend/setup.php</code> once to create your admin login.
        </div>
      </form>
    </div>
  );
}

// =================================================================
// Main app
// =================================================================
function App() {
  const [authToken, setAuthToken] = useState(() => localStorage.getItem('appguard_token') || '');
  const [authUsername, setAuthUsername] = useState('');
  const [booting, setBooting] = useState(true);
  const [loadError, setLoadError] = useState('');

  const [tab, setTab] = useState('dashboard');
  const [users, setUsers] = useState([]);
  const [query, setQuery] = useState('');
  const [statusFilter, setStatusFilter] = useState('all');
  const [deviceModalUser, setDeviceModalUser] = useState(null);
  const [extendModalUser, setExtendModalUser] = useState(null);
  const [extendDays, setExtendDays] = useState(5);
  const [extendError, setExtendError] = useState('');
  const [generatedLink, setGeneratedLink] = useState(null);
  const [deleteModalUser, setDeleteModalUser] = useState(null);
  const [deleteBusy, setDeleteBusy] = useState(false);
  const [resetTokenModalUser, setResetTokenModalUser] = useState(null);
  const [resetTokenResult, setResetTokenResult] = useState(null);
  const [resetTokenBusy, setResetTokenBusy] = useState(false);
  const [logs, setLogs] = useState([]);
  const [toast, setToast] = useState(null);
  const [updateForm, setUpdateForm] = useState({ version: '', notes: '', force: false, target: 'all' });
  const [updateHistory, setUpdateHistory] = useState([]);

  function showToast(msg) {
    setToast(msg);
    setTimeout(() => setToast(null), 2600);
  }

  async function api(path, options = {}) {
    const res = await fetch(`${API_BASE}/${path}`, {
      ...options,
      headers: {
        'Content-Type': 'application/json',
        ...(authToken ? { Authorization: `Bearer ${authToken}` } : {}),
        ...(options.headers || {}),
      },
    });
    let data = {};
    try { data = await res.json(); } catch (e) { /* non-JSON response */ }
    if (res.status === 401) {
      localStorage.removeItem('appguard_token');
      setAuthToken('');
      throw new Error('Session expired — please log in again');
    }
    if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
    return data;
  }

  async function refreshAll() {
    const [u, l, h] = await Promise.all([
      api('users_list.php'),
      api('logs_list.php'),
      api('update_history_list.php'),
    ]);
    setUsers(u.users || []);
    setLogs(l.logs || []);
    setUpdateHistory(h.history || []);
  }

  async function refreshLogs() {
    try { const l = await api('logs_list.php'); setLogs(l.logs || []); } catch (e) { /* ignore */ }
  }

  useEffect(() => {
    let cancelled = false;
    async function boot() {
      if (!authToken) { setBooting(false); return; }
      setBooting(true);
      setLoadError('');
      try {
        const me = await api('me.php');
        if (cancelled) return;
        setAuthUsername(me.username || '');
        await refreshAll();
      } catch (e) {
        if (cancelled) return;
        if (!String(e.message).includes('Session expired')) {
          setLoadError(e.message || 'Could not reach the backend.');
        }
      } finally {
        if (!cancelled) setBooting(false);
      }
    }
    boot();
    return () => { cancelled = true; };
  }, [authToken]);

  // Poll for fresh data every 20s so newly signed-up / logged-in users
  // show up on their own instead of only after a manual refresh click.
  useEffect(() => {
    if (!authToken || booting || loadError) return;
    const interval = setInterval(() => { refreshAll().catch(() => {}); }, 20000);
    return () => clearInterval(interval);
  }, [authToken, booting, loadError]);

  async function handleLogin(username, password) {
    const res = await fetch(`${API_BASE}/login.php`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Login failed');
    localStorage.setItem('appguard_token', data.token);
    setAuthUsername(data.username || username);
    setAuthToken(data.token);
  }

  function handleLogout() {
    api('logout.php', { method: 'POST' }).catch(() => {});
    localStorage.removeItem('appguard_token');
    setAuthToken('');
    setUsers([]); setLogs([]); setUpdateHistory([]);
    setTab('dashboard');
  }

  async function toggleBlock(user) {
    try {
      const res = await api('user_block_toggle.php', { method: 'POST', body: JSON.stringify({ user_id: user.id }) });
      setUsers(prev => prev.map(u => u.id === user.id ? { ...u, status: res.status } : u));
      showToast(`${user.name} ${res.status === 'blocked' ? 'blocked' : 'unblocked'}`);
      refreshLogs();
    } catch (e) { showToast(e.message); }
  }

  function openDelete(user) {
    setDeleteModalUser(user);
  }

  async function confirmDeleteUser() {
    if (!deleteModalUser) return;
    setDeleteBusy(true);
    try {
      await api('user_delete.php', { method: 'POST', body: JSON.stringify({ user_id: deleteModalUser.id }) });
      setUsers(prev => prev.filter(u => u.id !== deleteModalUser.id));
      showToast(`${deleteModalUser.name} deleted`);
      setDeleteModalUser(null);
      refreshLogs();
    } catch (e) {
      showToast(e.message);
    } finally {
      setDeleteBusy(false);
    }
  }

  function openResetToken(user) {
    setResetTokenModalUser(user);
    setResetTokenResult(null);
  }

  async function confirmResetToken() {
    if (!resetTokenModalUser) return;
    setResetTokenBusy(true);
    try {
      const res = await api('user_reset_token.php', { method: 'POST', body: JSON.stringify({ user_id: resetTokenModalUser.id }) });
      setResetTokenResult(res.token);
      setUsers(prev => prev.map(u => u.id === resetTokenModalUser.id ? { ...u, token: res.token } : u));
      showToast(`${resetTokenModalUser.name}'s token reset`);
      refreshLogs();
    } catch (e) {
      showToast(e.message);
    } finally {
      setResetTokenBusy(false);
    }
  }

  function copyResetToken() {
    if (navigator.clipboard && resetTokenResult) {
      navigator.clipboard.writeText(resetTokenResult).then(() => showToast('Token copied')).catch(() => showToast('Could not copy — select manually'));
    }
  }

  async function revokeDevice(userId, device) {
    try {
      await api('device_revoke.php', { method: 'POST', body: JSON.stringify({ device_id: device.id }) });
      setUsers(prev => prev.map(u => u.id === userId ? { ...u, devices: u.devices.filter(d => d.id !== device.id) } : u));
      setDeviceModalUser(prev => prev && prev.id === userId ? { ...prev, devices: prev.devices.filter(d => d.id !== device.id) } : prev);
      showToast('Device revoked');
      refreshLogs();
    } catch (e) { showToast(e.message); }
  }

  function openExtend(user) {
    setExtendModalUser(user);
    setExtendDays(5);
    setExtendError('');
    setGeneratedLink(null);
  }

  async function generateLink() {
    if (extendDays < 5) { setExtendError('Minimum extension is 5 days'); return; }
    setExtendError('');
    try {
      const res = await api('user_generate_link.php', { method: 'POST', body: JSON.stringify({ user_id: extendModalUser.id, days: extendDays }) });
      setGeneratedLink(res.link);
      refreshLogs();
    } catch (e) { setExtendError(e.message); }
  }

  function copyLink() {
    if (navigator.clipboard) {
      navigator.clipboard.writeText(generatedLink).then(() => showToast('Link copied')).catch(() => showToast('Could not copy — select manually'));
    }
  }

  async function closeExtendAndRefresh() {
    try {
      const u = await api('users_list.php');
      setUsers(u.users || []);
    } catch (e) { /* ignore */ }
    setExtendModalUser(null);
  }

  async function pushUpdate() {
    if (!updateForm.version.trim()) return;
    try {
      await api('update_push.php', { method: 'POST', body: JSON.stringify(updateForm) });
      showToast(`Update v${updateForm.version} pushed`);
      setUpdateForm({ version: '', notes: '', force: false, target: 'all' });
      const h = await api('update_history_list.php');
      setUpdateHistory(h.history || []);
      refreshLogs();
    } catch (e) { showToast(e.message); }
  }

  const filteredUsers = useMemo(() => {
    const q = query.trim().toLowerCase();
    return users.filter(u => {
      const matchesSearch = !q || u.name.toLowerCase().includes(q) || u.token.toLowerCase().includes(q) || u.devices.some(d => d.ip.includes(q));
      const matchesStatus = statusFilter === 'all' || (statusFilter === 'flagged' ? u.devices.length > MAX_DEVICES : u.status === statusFilter);
      return matchesSearch && matchesStatus;
    });
  }, [users, query, statusFilter]);

  const allDevices = useMemo(() => {
    const q = query.trim().toLowerCase();
    return users.flatMap(u => u.devices.map(d => ({ ...d, userName: u.name, userId: u.id, token: u.token })))
      .filter(d => !q || d.userName.toLowerCase().includes(q) || d.ip.includes(q) || d.id.toLowerCase().includes(q));
  }, [users, query]);

  const stats = useMemo(() => ({
    total: users.length,
    active: users.filter(u => u.status === 'active').length,
    blocked: users.filter(u => u.status === 'blocked').length,
    flagged: users.filter(u => u.devices.length > MAX_DEVICES).length,
  }), [users]);

  const flaggedUsers = users.filter(u => u.devices.length > MAX_DEVICES);

  let body;
  if (!authToken) {
    body = <LoginScreen onLogin={handleLogin} />;
  } else if (booting) {
    body = <div className="loading-screen">Loading console…</div>;
  } else if (loadError) {
    body = (
      <div className="config-error-screen">
        <div className="box">
          <h3>Couldn't load data</h3>
          <p>{loadError}</p>
          <p style={{ fontSize: 12, color: 'var(--text-secondary)' }}>
            Double-check the DB credentials in <code>backend/config.php</code>, that <code>schema.sql</code> has been
            imported, and that <code>API_BASE</code> at the top of this file points to your backend folder.
          </p>
          <button className="btn ghost" onClick={handleLogout}>Log out and try again</button>
        </div>
      </div>
    );
  } else {
    body = (
      <>
        <aside className="sidebar">
          <div className="brand">
            <div className="brand-mark">AP</div>
            <div>
              <div className="brand-name">AppGuard</div>
              <div className="brand-sub">Admin Console</div>
            </div>
          </div>
          <nav className="nav">
            {navItems.map(item => {
              const Icon = item.icon;
              return (
                <div key={item.id} className={`nav-item${tab === item.id ? ' active' : ''}`} onClick={() => setTab(item.id)}>
                  <Icon />
                  <span>{item.label}</span>
                </div>
              );
            })}
          </nav>
          <div style={{ marginTop: 'auto' }}>
            <div className="sidebar-footer">Max devices per token: {MAX_DEVICES}<br />Min extend: 5 days</div>
            <div className="sidebar-user">
              <span className="who">{authUsername || 'admin'}</span>
              <div className="icon-btn danger" title="Log out" onClick={handleLogout}><LogOutIcon /></div>
            </div>
          </div>
        </aside>

        <div className="main">
          <div className="topbar">
            <div>
              <h1>
                {tab === 'dashboard' && 'Dashboard'}
                {tab === 'users' && 'Users & Tokens'}
                {tab === 'devices' && 'Devices'}
                {tab === 'update' && 'Remote Update'}
                {tab === 'logs' && 'Activity Log'}
              </h1>
              <p>
                {tab === 'dashboard' && 'Overview of token usage, devices and blocks'}
                {tab === 'users' && 'Search, block/unblock and extend user tokens'}
                {tab === 'devices' && 'All device sessions across every token'}
                {tab === 'update' && 'Push app updates and force-update rules'}
                {tab === 'logs' && 'Every admin action, most recent first'}
              </p>
            </div>
            <div className="topbar-right">
              <div className="icon-btn brass" title="Refresh data" onClick={() => refreshAll().catch(e => showToast(e.message))}><RefreshCw /></div>
              <div className="status-pill"><span className="pulse-dot" />Console online</div>
            </div>
          </div>

          <div className="content">
            {tab === 'dashboard' && (
              <>
                <div className="stat-grid">
                  <div className="stat-card brass"><div className="label"><UsersIcon />Total Users</div><div className="value">{stats.total}</div></div>
                  <div className="stat-card teal"><div className="label"><CheckCircle2 />Active Tokens</div><div className="value">{stats.active}</div></div>
                  <div className="stat-card danger"><div className="label"><Ban />Blocked</div><div className="value">{stats.blocked}</div></div>
                  <div className="stat-card amber"><div className="label"><ShieldAlert />Multi-Device Flags</div><div className="value">{stats.flagged}</div></div>
                </div>

                <div className="two-col">
                  <div className="panel">
                    <div className="panel-header"><h2>Flagged — token used on too many devices</h2></div>
                    {flaggedUsers.length === 0 && <div className="empty">No flags. Every token is within the {MAX_DEVICES}-device limit.</div>}
                    {flaggedUsers.map(u => (
                      <div key={u.id} className="log-row" style={{ alignItems: 'center' }}>
                        <div className="log-icon"><AlertTriangle /></div>
                        <div style={{ flex: 1 }}>
                          <div className="log-text">{u.name} <span className="token-pill" style={{ marginLeft: 6 }}>{u.token}</span></div>
                          <div className="log-time"><DeviceDots count={u.devices.length} /></div>
                        </div>
                        <button className="btn ghost" onClick={() => { setTab('users'); setDeviceModalUser(u); }}>View</button>
                      </div>
                    ))}
                  </div>

                  <div className="panel">
                    <div className="panel-header"><h2>Recent Activity</h2></div>
                    {logs.slice(0, 5).map(l => (
                      <div key={l.id} className="log-row">
                        <div className="log-icon"><LogIcon action={l.action} /></div>
                        <div>
                          <div className="log-text">{l.text}</div>
                          <div className="log-time">{fmtLogTime(l.time)}</div>
                        </div>
                      </div>
                    ))}
                    {logs.length === 0 && <div className="empty">No activity yet.</div>}
                  </div>
                </div>
              </>
            )}

            {tab === 'users' && (
              <>
                <div className="toolbar">
                  <div className="search-box"><Search /><input placeholder="Search by name, token or IP" value={query} onChange={e => setQuery(e.target.value)} /></div>
                  <div className="chip-group">
                    {['all', 'active', 'blocked', 'flagged'].map(f => (
                      <div key={f} className={`chip${statusFilter === f ? ' active' : ''}`} onClick={() => setStatusFilter(f)}>
                        {f === 'all' ? 'All' : f === 'active' ? 'Active' : f === 'blocked' ? 'Blocked' : 'Flagged'}
                      </div>
                    ))}
                  </div>
                </div>

                <div className="panel">
                  <div className="table-wrap">
                    <table>
                      <thead>
                        <tr>
                          <th>User</th><th>Token</th><th>Devices</th><th>IP Address</th><th>Expiry</th><th>Status</th><th>Actions</th>
                        </tr>
                      </thead>
                      <tbody>
                        {filteredUsers.map(u => {
                          const uniqueIps = [...new Set(u.devices.map(d => d.ip))];
                          const dLeft = daysUntil(u.expiry);
                          return (
                            <tr key={u.id}>
                              <td className="user-cell" data-label="User"><div className="name">{u.name}</div><div className="email">{u.email}</div></td>
                              <td data-label="Token"><span className="token-pill">{u.token}</span></td>
                              <td data-label="Devices"><DeviceDots count={u.devices.length} /></td>
                              <td data-label="IP Address">
                                <span className="ip-mono">{uniqueIps[0]}</span>
                                {uniqueIps.length > 1 && <span style={{ color: 'var(--text-muted)', fontSize: 11.5, marginLeft: 5 }}>+{uniqueIps.length - 1} more</span>}
                              </td>
                              <td data-label="Expiry" style={{ color: dLeft < 0 ? 'var(--text-muted)' : dLeft <= 3 ? 'var(--amber)' : 'var(--text-secondary)' }}>{fmtDate(u.expiry)}</td>
                              <td data-label="Status"><StatusBadge user={u} /></td>
                              <td data-label="Actions">
                                <div className="row-actions">
                                  <div className="icon-btn brass" title="View devices" onClick={() => setDeviceModalUser(u)}><Smartphone /></div>
                                  <div className="icon-btn brass" title="Extend token" onClick={() => openExtend(u)}><Link2 /></div>
                                  <div className={`icon-btn${u.status !== 'blocked' ? ' danger' : ''}`} title={u.status === 'blocked' ? 'Unblock' : 'Block'} onClick={() => toggleBlock(u)}>
                                    {u.status === 'blocked' ? <CheckCircle2 /> : <Ban />}
                                  </div>
                                  <div className="icon-btn brass" title="Reset token" onClick={() => openResetToken(u)}><KeyRound /></div>
                                  <div className="icon-btn danger" title="Delete user" onClick={() => openDelete(u)}><Trash2 /></div>
                                </div>
                              </td>
                            </tr>
                          );
                        })}
                        {filteredUsers.length === 0 && (
                          <tr><td colSpan={7}><div className="empty">No users match this search/filter.</div></td></tr>
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>
              </>
            )}

            {tab === 'devices' && (
              <>
                <div className="toolbar">
                  <div className="search-box"><Search /><input placeholder="Search by user, IP or device ID" value={query} onChange={e => setQuery(e.target.value)} /></div>
                </div>
                <div className="panel">
                  <div className="table-wrap">
                    <table>
                      <thead><tr><th>User</th><th>Device ID</th><th>Platform</th><th>IP Address</th><th>Last Seen</th><th>Action</th></tr></thead>
                      <tbody>
                        {allDevices.map(d => (
                          <tr key={d.id}>
                            <td data-label="User">{d.userName}</td>
                            <td data-label="Device ID"><span className="token-pill">{d.id}</span></td>
                            <td data-label="Platform">{d.platform}</td>
                            <td data-label="IP Address"><span className="ip-mono">{d.ip}</span></td>
                            <td data-label="Last Seen" style={{ color: 'var(--text-secondary)' }}>{fmtDT(d.lastSeen)}</td>
                            <td data-label="Action"><div className="icon-btn danger" title="Revoke device" onClick={() => revokeDevice(d.userId, d)}><XIcon /></div></td>
                          </tr>
                        ))}
                        {allDevices.length === 0 && <tr><td colSpan={6}><div className="empty">No devices match this search.</div></td></tr>}
                      </tbody>
                    </table>
                  </div>
                </div>
              </>
            )}

            {tab === 'update' && (
              <div className="two-col">
                <div className="panel">
                  <div className="panel-header"><h2>Push a remote update</h2></div>
                  <div className="modal-body">
                    <div className="field">
                      <label>Version</label>
                      <input type="text" placeholder="e.g. 2.5.0" value={updateForm.version} onChange={e => setUpdateForm({ ...updateForm, version: e.target.value })} />
                    </div>
                    <div className="field">
                      <label>Release notes</label>
                      <textarea placeholder="What changed in this update?" value={updateForm.notes} onChange={e => setUpdateForm({ ...updateForm, notes: e.target.value })} />
                    </div>
                    <div className="field">
                      <label>Target</label>
                      <select value={updateForm.target} onChange={e => setUpdateForm({ ...updateForm, target: e.target.value })}>
                        <option value="all">All Users</option>
                        <option value="active">Active Users Only</option>
                        <option value="flagged">Flagged (Multi-Device) Only</option>
                      </select>
                    </div>
                    <div className="toggle-row">
                      <div>
                        <div className="t-label">Force update</div>
                        <div className="t-sub">Blocks app use until user updates</div>
                      </div>
                      <div className={`toggle${updateForm.force ? ' on' : ''}`} onClick={() => setUpdateForm({ ...updateForm, force: !updateForm.force })}><div className="knob" /></div>
                    </div>
                    <button className="btn primary" disabled={!updateForm.version.trim()} onClick={pushUpdate}><Send />Push Update</button>
                  </div>
                </div>

                <div className="panel">
                  <div className="panel-header"><h2>Push history</h2></div>
                  {updateHistory.map(h => (
                    <div key={h.id} className="log-row">
                      <div className="log-icon"><Send /></div>
                      <div>
                        <div className="log-text">v{h.version} → {h.target === 'all' ? 'All Users' : h.target} {(h.force_update === 1 || h.force_update === true) ? '· forced' : '· optional'}</div>
                        <div className="log-time">{fmtLogTime(h.time)}</div>
                      </div>
                    </div>
                  ))}
                  {updateHistory.length === 0 && <div className="empty">No updates pushed yet.</div>}
                </div>
              </div>
            )}

            {tab === 'logs' && (
              <div className="panel">
                {logs.map(l => (
                  <div key={l.id} className="log-row">
                    <div className="log-icon"><LogIcon action={l.action} /></div>
                    <div>
                      <div className="log-text">{l.text}</div>
                      <div className="log-time">{fmtLogTime(l.time)}</div>
                    </div>
                  </div>
                ))}
                {logs.length === 0 && <div className="empty">No activity yet.</div>}
              </div>
            )}
          </div>
        </div>

        {deviceModalUser && (
          <div className="modal-overlay" onClick={() => setDeviceModalUser(null)}>
            <div className="modal" onClick={e => e.stopPropagation()}>
              <div className="modal-header">
                <div>
                  <h3>{deviceModalUser.name}'s devices</h3>
                  <p style={{ color: deviceModalUser.devices.length > MAX_DEVICES ? 'var(--amber)' : 'var(--text-secondary)' }}>
                    {deviceModalUser.devices.length}/{MAX_DEVICES} devices on this token
                  </p>
                </div>
                <XIcon className="close-btn" onClick={() => setDeviceModalUser(null)} />
              </div>
              <div className="modal-body">
                <div className="device-list">
                  {deviceModalUser.devices.map(d => (
                    <div key={d.id} className="device-row">
                      <div>
                        <div className="d-id">{d.id} · {d.ip}</div>
                        <div className="d-meta">{d.platform} · last seen {fmtDT(d.lastSeen)}</div>
                      </div>
                      <div className="icon-btn danger" title="Revoke this device" onClick={() => revokeDevice(deviceModalUser.id, d)}><XIcon /></div>
                    </div>
                  ))}
                  {deviceModalUser.devices.length === 0 && <div className="empty">No devices left on this token.</div>}
                </div>
              </div>
            </div>
          </div>
        )}

        {extendModalUser && (
          <div className="modal-overlay" onClick={() => setExtendModalUser(null)}>
            <div className="modal" onClick={e => e.stopPropagation()}>
              <div className="modal-header">
                <div>
                  <h3>Extend token</h3>
                  <p>{extendModalUser.name} · currently expires {fmtDate(extendModalUser.expiry)}</p>
                </div>
                <XIcon className="close-btn" onClick={() => setExtendModalUser(null)} />
              </div>
              <div className="modal-body">
                <div className="field">
                  <label>Extension length (minimum 5 days)</label>
                  <input type="number" min={5} value={extendDays} onChange={e => { setExtendDays(Number(e.target.value)); setExtendError(''); }} />
                  <div className="quick-days">
                    {[5, 7, 15, 30].map(d => (
                      <div key={d} className={`quick-day-btn${extendDays === d ? ' selected' : ''}`} onClick={() => { setExtendDays(d); setExtendError(''); }}>{d}d</div>
                    ))}
                  </div>
                  {!generatedLink && (
                    <div style={{ fontSize: 11.5, color: 'var(--text-muted)', marginTop: 8 }}>
                      New expiry would be {fmtDate(addDaysToDate(extendModalUser.expiry, extendDays))}
                    </div>
                  )}
                  {extendError && <div className="error-text"><AlertTriangle />{extendError}</div>}
                </div>

                {!generatedLink && <button className="btn primary" onClick={generateLink}><Link2 />Generate extend link</button>}

                {generatedLink && (
                  <>
                    <div className="link-box"><span>{generatedLink}</span><div className="icon-btn brass" onClick={copyLink}><Copy /></div></div>
                    <p style={{ fontSize: 12, color: 'var(--text-secondary)', margin: 0 }}>
                      Send this link to the user (WhatsApp, email, SMS). The moment they open it, their token is
                      extended by {extendDays} days automatically — no further action needed here.
                    </p>
                    <button className="btn ghost" onClick={closeExtendAndRefresh}><RefreshCw />Close &amp; refresh status</button>
                  </>
                )}
              </div>
            </div>
          </div>
        )}

        {deleteModalUser && (
          <div className="modal-overlay" onClick={() => !deleteBusy && setDeleteModalUser(null)}>
            <div className="modal" onClick={e => e.stopPropagation()}>
              <div className="modal-header">
                <div>
                  <h3>Delete user</h3>
                  <p>{deleteModalUser.name} · {deleteModalUser.email}</p>
                </div>
                <XIcon className="close-btn" onClick={() => !deleteBusy && setDeleteModalUser(null)} />
              </div>
              <div className="modal-body">
                <div className="error-text"><AlertTriangle />This permanently removes the user, their token, and all their device history. This can't be undone.</div>
                <button className="btn danger" disabled={deleteBusy} onClick={confirmDeleteUser}>
                  <Trash2 />{deleteBusy ? 'Deleting…' : 'Delete permanently'}
                </button>
                <button className="btn ghost" disabled={deleteBusy} onClick={() => setDeleteModalUser(null)}>Cancel</button>
              </div>
            </div>
          </div>
        )}

        {resetTokenModalUser && (
          <div className="modal-overlay" onClick={() => { if (!resetTokenBusy) { setResetTokenModalUser(null); setResetTokenResult(null); } }}>
            <div className="modal" onClick={e => e.stopPropagation()}>
              <div className="modal-header">
                <div>
                  <h3>Reset token</h3>
                  <p>{resetTokenModalUser.name}</p>
                </div>
                <XIcon className="close-btn" onClick={() => { setResetTokenModalUser(null); setResetTokenResult(null); }} />
              </div>
              <div className="modal-body">
                {!resetTokenResult && (
                  <>
                    <div className="error-text"><AlertTriangle />Their current token ({resetTokenModalUser.token}) will stop working immediately. Only share the new one with this user.</div>
                    <button className="btn primary" disabled={resetTokenBusy} onClick={confirmResetToken}>
                      <KeyRound />{resetTokenBusy ? 'Resetting…' : 'Reset token'}
                    </button>
                  </>
                )}
                {resetTokenResult && (
                  <>
                    <div className="link-box"><span>{resetTokenResult}</span><div className="icon-btn brass" onClick={copyResetToken}><Copy /></div></div>
                    <p style={{ fontSize: 12, color: 'var(--text-secondary)', margin: 0 }}>
                      Save this now — it won't be shown again. Send it to the user in place of their old token.
                    </p>
                    <button className="btn ghost" onClick={() => { setResetTokenModalUser(null); setResetTokenResult(null); }}>Close</button>
                  </>
                )}
              </div>
            </div>
          </div>
        )}
      </>
    );
  }

  return (
    <div className="app-root">
      <style>{css}</style>
      {body}
      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
